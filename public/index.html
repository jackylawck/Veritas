  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; max-width: 860px; margin: 0 auto; line-height: 1.5; }
    .header-bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.25rem; }
    h1 { color: #f0f6fc; font-size: 1.4rem; margin: 0; }
    .lang-btn { background: #21262d; border: 1px solid #30363d; color: #58a6ff; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .lang-btn:hover { background: #30363d; }
    .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .box { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; }
    .card h2 { font-size: 1rem; margin: 0 0 0.5rem 0; color: #f0f6fc; }
    .ioc { font-family: ui-monospace, monospace; background: #000; padding: 2px 6px; border-radius: 4px; color: #ff7b72; font-size: 0.85rem; }
    .badge { font-size: 0.75rem; border: 1px solid #30363d; padding: 2px 6px; border-radius: 12px; color: #8b949e; margin-left: 0.5rem; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script src="i18n.js"></script>
</head>
<body>

  <div class="header-bar">
    <h1 id="ui-title">Veritas | 揭偽</h1>
    <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">Switch to English</button>
  </div>
  <div class="sub" id="ui-sub">法定機構防詐公報結構化 STIX 2.1 鏡像 · 滾動熱資料 (自 2024 年至今)</div>

  <div class="box">
    <strong id="ui-feed-label">機器端點 (Machine Feed):</strong>
    <a href="api/bundle-latest.json">/api/bundle-latest.json</a>
    <span style="color: #8b949e; margin-left: 0.75rem;">|</span>
    <span style="color: #8b949e; margin-left: 0.75rem;" id="stat">連線中...</span>
  </div>

  <div id="list">載入中...</div>

  <script>
    let currentLang = localStorage.getItem('veritas_lang') || 'zh';
    let cachedBundle = null;

    function cleanPattern(pattern) {
      if (!pattern) return '';
      const match = pattern.match(/=\s*['"]([^'"]+)['"]/);
      return match ? match[1] : pattern;
    }

    function applyLocale() {
      const t = I18N[currentLang];
      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('ui-sub').textContent = t.sub;
      document.getElementById('ui-feed-label').textContent = t.feedLabel;
      document.getElementById('lang-toggle').textContent = t.btnText;
      document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
      if (cachedBundle) {
        renderBundle(cachedBundle);
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('veritas_lang', currentLang);
      applyLocale();
    }

    function renderBundle(data) {
      const t = I18N[currentLang];
      const reports = data.objects.filter(o => o.type === 'report');
      const indicators = Object.fromEntries(
        data.objects.filter(o => o.type === 'indicator').map(i => [i.id, i.pattern])
      );

      document.getElementById('stat').textContent = `${t.statPrefix} ${reports.length} ${t.statSuffix}`;
      const container = document.getElementById('list');
      container.innerHTML = '';

      if (reports.length === 0) {
        container.innerHTML = `<p>${t.empty}</p>`;
        return;
      }

      reports.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';

        const rawPatterns = (r.object_refs || []).map(id => indicators[id]).filter(Boolean);
        const displayPatterns = rawPatterns.map(cleanPattern).join(' | ');
        const tooltip = rawPatterns.join('\n');

        card.innerHTML = `
          <h2>${r.name} <span class="badge">STIX 2.1</span></h2>
          <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 0.5rem;">${t.dateLabel} ${r.published.slice(0, 10)}</div>
          <div><strong>${t.iocLabel}</strong> <span class="ioc" title="${tooltip}">${displayPatterns || t.noIoc}</span></div>
          ${r.external_references && r.external_references[0] 
            ? `<div style="margin-top: 0.5rem;"><a href="${r.external_references[0].url}" target="_blank" rel="noopener noreferrer">${t.prLink}</a></div>` 
            : ''}
        `;
        container.appendChild(card);
      });
    }

    applyLocale();
    fetch('api/bundle-latest.json')
      .then(res => res.json())
      .then(data => {
        cachedBundle = data;
        renderBundle(data);
      })
      .catch(() => {
        document.getElementById('list').innerHTML = `<p style="color:#f85149;">${I18N[currentLang].errLoad}</p>`;
      });
  </script>
</body>
