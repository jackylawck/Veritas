<!DOCTYPE html>
<html lang="zh-HK" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>🛡️ Veritas 揭偽 | 主權級防偽與威脅情報帳本 (Sovereign Fraud Intelligence)</title>
  
  <meta name="description" content="Veritas (揭偽) 是一個企業級、開源、雙語的跨國主權防偽威脅情報鏡像帳本。即時匯聚香港金管局 (HKMA)、香港證監會 (SFC)、新加坡金管局 (MAS) 等全球法定機構公報。">
  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />
  
  <link rel="icon" type="image/png" sizes="192x192" href="Veritas192icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="manifest" href="manifest.json">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; max-width: 860px; margin: 0 auto; line-height: 1.5; }
    .header-bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.25rem; }
    h1 { color: #f0f6fc; font-size: 1.4rem; margin: 0; }
    .lang-btn { background: #21262d; border: 1px solid #30363d; color: #58a6ff; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .lang-btn:hover { background: #30363d; }
    .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.2rem; }
    .box { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
    
    /* 搜尋框專屬樣式 */
    .search-box { width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem 1rem; color: #f0f6fc; font-size: 0.95rem; margin-bottom: 1.2rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-box:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2); }
    .search-box::placeholder { color: #6e7681; }

    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; }
    .card h2 { font-size: 1rem; margin: 0 0 0.5rem 0; color: #f0f6fc; }
    .ioc { font-family: ui-monospace, monospace; background: #000; padding: 2px 6px; border-radius: 4px; color: #ff7b72; font-size: 0.85rem; word-break: break-all; }
    .badge { font-size: 0.75rem; border: 1px solid #30363d; padding: 2px 6px; border-radius: 12px; color: #8b949e; margin-left: 0.5rem; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script src="i18n.js"></script>
</head>
<body>

  <div class="header-bar">
    <h1 id="ui-title">Veritas | 揭偽</h1>
    <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">Switch to English</button>
  </div>
  <div class="sub" id="ui-sub">法定機構防詐公報結構化 STIX 2.1 鏡像 · 滾動熱資料 (自 2024 年至今)</div>

  <div class="box">
    <strong id="ui-feed-label">機器端點 (Machine Feed):</strong>
    <a href="api/bundle-latest.json">/api/bundle-latest.json</a>
    <span style="color: #8b949e; margin-left: 0.75rem;">|</span>
    <span style="color: #8b949e; margin-left: 0.75rem;" id="stat">連線中...</span>
  </div>

  <!-- 即時搜尋輸入框 -->
  <input type="text" id="search-input" class="search-box" placeholder="🔍 搜尋可疑網域、銀行或機構名稱..." oninput="handleSearch()">

  <div id="list">載入中...</div>

  <footer style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #30363d; font-size: 0.8rem; color: #8b949e; text-align: center;">
    <div>Veritas Project · Zero-PII Sovereign Threat Intelligence Mirror</div>
    <div style="margin-top: 0.5rem;">
      <a href="https://github.com/jackylawck/Veritas/blob/main/LEGAL_COMPLIANCE.md" target="_blank" rel="noopener noreferrer" style="color: #58a6ff; margin: 0 0.5rem;">⚖️ Legal & AI Compliance</a>
      <span>·</span>
      <a href="https://github.com/jackylawck/Veritas" target="_blank" rel="noopener noreferrer" style="color: #58a6ff; margin: 0 0.5rem;">GitHub Source</a>
    </div>
  </footer>

  <script>
    let currentLang = localStorage.getItem('veritas_lang') || 'zh';
    let cachedBundle = null;
    let allReports = [];
    let indicatorMap = {};

    function cleanPattern(pattern) {
      if (!pattern) return '';
      const match = pattern.match(/=\s*['"]([^'"]+)['"]/);
      return match ? match[1] : pattern;
    }

    function applyLocale() {
      const t = I18N[currentLang];
      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('ui-sub').textContent = t.sub;
      document.getElementById('ui-feed-label').textContent = t.feedLabel;
      document.getElementById('lang-toggle').textContent = t.btnText;
      document.getElementById('search-input').placeholder = t.searchPlaceholder;
      document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
      
      handleSearch();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('veritas_lang', currentLang);
      applyLocale();
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const t = I18N[currentLang];

      if (!query) {
        renderReports(allReports);
        return;
      }

      // 即時過濾：比對 標題、描述、以及關聯的 IoC Pattern / Domain
      const filtered = allReports.filter(r => {
        const titleMatch = (r.name || '').toLowerCase().includes(query);
        const descMatch = (r.description || '').toLowerCase().includes(query);
        const iocMatch = (r.object_refs || []).some(id => {
          const pat = indicatorMap[id] || '';
          return pat.toLowerCase().includes(query);
        });
        return titleMatch || descMatch || iocMatch;
      });

      renderReports(filtered, true);
    }

    function renderReports(reports, isSearching = false) {
      const t = I18N[currentLang];
      document.getElementById('stat').textContent = `${t.statPrefix} ${reports.length} ${t.statSuffix}`;
      const container = document.getElementById('list');
      container.innerHTML = '';

      if (reports.length === 0) {
        container.innerHTML = `<p style="color: #8b949e; text-align: center; padding: 2rem 0;">${isSearching ? t.noMatch : t.empty}</p>`;
        return;
      }

      reports.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';

        const rawPatterns = (r.object_refs || []).map(id => indicatorMap[id]).filter(Boolean);
        const displayPatterns = rawPatterns.map(cleanPattern).join(' | ');
        const tooltip = rawPatterns.join('\n');

        card.innerHTML = `
          <h2>${r.name} <span class="badge">STIX 2.1</span></h2>
          <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 0.5rem;">${t.dateLabel} ${r.published.slice(0, 10)}</div>
          <div><strong>${t.iocLabel}</strong> <span class="ioc" title="${tooltip}">${displayPatterns || t.noIoc}</span></div>
          ${r.external_references && r.external_references[0] 
            ? `<div style="margin-top: 0.5rem;"><a href="${r.external_references[0].url}" target="_blank" rel="noopener noreferrer">${t.prLink}</a></div>` 
            : ''}
        `;
        container.appendChild(card);
      });
    }

    // 初次初始化資料
    applyLocale();
    fetch('api/bundle-latest.json')
      .then(res => res.json())
      .then(data => {
        cachedBundle = data;
        allReports = data.objects.filter(o => o.type === 'report');
        indicatorMap = Object.fromEntries(
          data.objects.filter(o => o.type === 'indicator').map(i => [i.id, i.pattern])
        );
        handleSearch();
      })
      .catch(() => {
        document.getElementById('list').innerHTML = `<p style="color:#f85149;">${I18N[currentLang].errLoad}</p>`;
      });
  </script>
</body>
</html>
